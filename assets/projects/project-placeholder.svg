<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Project image placeholder</title>
  <desc id="desc">Upload the matching .webp file into the assets/projects folder to replace this placeholder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b57d0" />
      <stop offset="100%" stop-color="#8db4ff" />
    </linearGradient>
  </defs>
  <rect width="1200" height="750" rx="36" fill="#eef4ff" />
  <rect x="40" y="40" width="1120" height="670" rx="28" fill="url(#bg)" />
  <rect x="115" y="120" width="970" height="410" rx="28" fill="#ffffff" opacity="0.92" />
  <text x="600" y="340" text-anchor="middle" font-size="62" font-family="Inter, Arial, sans-serif" font-weight="800" fill="#0b57d0">Project Preview</text>
  <text x="600" y="390" text-anchor="middle" font-size="24" font-family="Inter, Arial, sans-serif" fill="#4f648f">Upload your .webp image into `assets/projects/`</text>
  <text x="600" y="625" text-anchor="middle" font-size="28" font-family="Inter, Arial, sans-serif" fill="#eef4ff">Fallback placeholder until your real project thumbnails are added</text>
</svg>
